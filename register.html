{% extends "base.html" %}
{% block title %}Create Account — MediSmart AI{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card" style="max-width:480px;">
    <div class="auth-logo">⚕️</div>
    <h2>Create Your Account</h2>
    <p class="subtitle">Join 2M+ users managing their health smarter</p>

    <form method="POST" action="/register" id="registerForm">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="input"
               placeholder="Saloni Sharma" required autofocus />
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="input"
                 placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" name="phone" class="input"
                 placeholder="+91 98765 43210" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative;">
          <input type="password" name="password" id="pwd1" class="input"
                 placeholder="Min 6 characters" required
                 oninput="checkStrength(this.value)" />
          <button type="button" onclick="togglePwd('pwd1')"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                   background:none;border:none;cursor:pointer;font-size:1rem;">👁</button>
        </div>
        <!-- Password strength bar -->
        <div style="margin-top:6px;height:4px;border-radius:4px;background:var(--border);overflow:hidden;">
          <div id="strengthBar" style="height:100%;width:0%;border-radius:4px;transition:all .3s;"></div>
        </div>
        <div id="strengthLabel" style="font-size:.72rem;color:var(--text-muted);margin-top:3px;"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div style="position:relative;">
          <input type="password" name="confirm_password" id="pwd2" class="input"
                 placeholder="Re-enter your password" required />
          <button type="button" onclick="togglePwd('pwd2')"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                   background:none;border:none;cursor:pointer;font-size:1rem;">👁</button>
        </div>
      </div>

      <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:20px;">
        <input type="checkbox" id="terms" required
               style="width:16px;height:16px;margin-top:2px;accent-color:var(--primary);" />
        <label for="terms" style="font-size:.82rem;color:var(--text-secondary);line-height:1.5;">
          I agree to the <a href="#" style="color:var(--primary);font-weight:600;">Terms of Service</a>
          and <a href="#" style="color:var(--primary);font-weight:600;">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">
        🚀 Create Free Account
      </button>
    </form>

    <div class="auth-switch" style="margin-top:16px;">
      Already have an account? <a href="/login">Login →</a>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function togglePwd(id) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
function checkStrength(val) {
  const bar   = document.getElementById('strengthBar');
  const label = document.getElementById('strengthLabel');
  let score = 0;
  if (val.length >= 6)  score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const levels = [
    {w:'0%',  c:'',                     t:''},
    {w:'25%', c:'#ef4444',              t:'Weak'},
    {w:'50%', c:'#f97316',              t:'Fair'},
    {w:'75%', c:'#eab308',              t:'Good'},
    {w:'100%',c:'var(--success)',       t:'Strong 💪'},
  ];
  const l = levels[Math.min(score, 4)];
  bar.style.width      = l.w;
  bar.style.background = l.c;
  label.textContent    = l.t;
}
</script>
{% endblock %}
